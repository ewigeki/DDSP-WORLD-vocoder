root_dir: data
processed_dir: data/processed
source: wav

split:
  train_size: null
  test_size: 3
  val_size: 3

dataset:
  sample_rate: 48000
  frame_period: 4.0
  sample_duration: 4.0
  split_margin: 0.0
  overlap_ratio: 0.0
  cache_dir: ${data.processed_dir}
  load_cache: true
  save_cache: true
  rebuild_cache: false

loader:
  batch_size: 8
  num_workers: 12
  pin_memory: true
