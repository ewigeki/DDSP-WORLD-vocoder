_target_: lightning.Trainer
max_epochs: 1000
callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch:03d}-{val_loss:.4f}"
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/loss
    mode: min
    patience: 10
    min_delta: 1.0e-4
